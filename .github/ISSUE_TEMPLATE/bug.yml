name: Bug report
description: Report a reproducible application or permission-calculation defect
body:
  - type: markdown
    attributes:
      value: Do not include production snapshots, credentials, confidential paths or account inventories. Use SECURITY.md for sensitive reports.
  - type: input
    id: version
    attributes:
      label: PermissionScope version and Windows build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic SDDL, Windows comparison or redacted diagnostic
