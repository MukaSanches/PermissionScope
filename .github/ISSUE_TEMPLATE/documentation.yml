name: Documentation issue
description: Report unclear, outdated, inconsistent or misleading repository documentation.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: |
        Documentation is part of the product's trust surface. Please identify the exact page or claim and explain why it is unclear, outdated or inconsistent.
  - type: input
    id: location
    attributes:
      label: Document or path
      placeholder: README.md, SECURITY.md, docs/access-model.md, etc.
    validations:
      required: true
  - type: dropdown
    id: problem_type
    attributes:
      label: Problem type
      options:
        - Incorrect technical claim
        - Outdated release / compatibility information
        - Broken or confusing navigation
        - Missing explanation
        - Accessibility / readability
        - Localization inconsistency
        - Brand / terminology inconsistency
        - Other
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current wording or behavior
      description: Quote only the minimum text needed to identify the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Suggested correction or expected outcome
      description: Explain what a reader should be able to understand after the correction.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link code, Windows behavior, release evidence or another canonical source if the issue is factual.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I did not include secrets, private environment data or unpatched vulnerability details.
          required: true
