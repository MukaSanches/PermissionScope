name: Production Trust

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build/**'
      - 'distribution/**'
      - 'docs/accessibility.md'
      - 'docs/benchmarks.md'
      - 'docs/capability-matrix.md'
      - 'docs/hardware-validation.md'
      - 'docs/store-readiness.md'
      - 'docs/testing.md'
      - 'Directory.Build.props'
      - '.github/workflows/production-trust.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build/**'
      - 'distribution/**'
      - 'Directory.Build.props'
      - '.github/workflows/production-trust.yml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      extended_benchmark:
        description: Include the 10,000-file synthetic benchmark.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ui-and-benchmark:
    name: Native UI + benchmark evidence
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish native application for UI automation
        shell: pwsh
        run: dotnet publish src/PermissionScope.App/PermissionScope.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o artifacts/production-trust-app --nologo -v minimal
      - name: Publish CLI for controlled benchmarks
        shell: pwsh
        run: dotnet publish src/PermissionScope.Cli/PermissionScope.Cli.csproj -c Release -r win-x64 --self-contained true -o artifacts/production-trust-cli --nologo -v minimal
      - name: Exercise native UI across locales and themes
        shell: pwsh
        run: ./build/Test-UiTrust.ps1 -Application ./artifacts/production-trust-app/PermissionScope.exe
      - name: Run sanitized synthetic benchmark matrix
        shell: pwsh
        run: |
          $extended = '${{ github.event_name }}' -eq 'schedule' -or '${{ inputs.extended_benchmark }}' -eq 'true'
          if ($extended) {
            ./build/Measure-TrustBenchmarks.ps1 -CliPath ./artifacts/production-trust-cli/permissionscope-cli.exe -Extended
          } else {
            ./build/Measure-TrustBenchmarks.ps1 -CliPath ./artifacts/production-trust-cli/permissionscope-cli.exe
          }
      - name: Upload sanitized trust evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-trust-native-evidence
          path: |
            artifacts/production-trust/ui-trust.json
            artifacts/production-trust/benchmarks.json
          if-no-files-found: error

  distribution-readiness:
    name: Distribution readiness
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS with retry
        shell: pwsh
        run: |
          $last=1
          foreach($attempt in 1..3){
            choco install nsis --version=3.12 -y --no-progress
            $last=$LASTEXITCODE
            if($last -eq 0){ exit 0 }
            if($attempt -lt 3){ Start-Sleep -Seconds (15*$attempt) }
          }
          exit $last
      - name: Build current-version installers
        shell: pwsh
        run: |
          ./build/Package.ps1 -Architecture x64
          ./build/Package.ps1 -Architecture arm64
      - name: Build unsigned MSIX candidates
        shell: pwsh
        run: |
          ./build/Package-MSIX.ps1 -Architecture x64
          ./build/Package-MSIX.ps1 -Architecture arm64
      - name: Prepare current-version channel drafts
        shell: pwsh
        run: ./build/Prepare-Channels.ps1
      - name: Validate distribution candidates without overclaiming certification
        shell: pwsh
        run: ./build/Test-DistributionReadiness.ps1
      - name: Upload distribution readiness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-trust-distribution-readiness
          path: |
            artifacts/PermissionScope-*-unsigned.msix
            artifacts/PermissionScope-*-unsigned.msix.metadata.json
            artifacts/channels/**
            artifacts/production-trust/distribution-readiness.json
          if-no-files-found: error
