name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - name: Resolve project version
        shell: pwsh
        run: |
          . ./build/Get-ProjectVersion.ps1
          "PERMISSIONSCOPE_VERSION=$(Get-ProjectVersion -Root $PWD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build
        shell: pwsh
        run: |
          if ('${{ matrix.architecture }}' -eq 'arm64') {
            dotnet build src/PermissionScope.App/PermissionScope.App.csproj -c Release -p:Platform=ARM64 -r win-arm64
          } else {
            dotnet build PermissionScope.sln -c Release -p:Platform=x64
          }
      - name: Test
        if: matrix.architecture == 'x64'
        run: dotnet run --project tests/PermissionScope.Tests -c Release -- --results artifacts/test-results.json
      - name: Typed worker replay safety
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: ./build/Test-WorkerReplay.ps1 -ReplayPath ./tests/PermissionScope.WorkerReplay/bin/Release/net10.0-windows10.0.19041.0/permissionscope-worker-replay.exe -CliPath ./src/PermissionScope.Cli/bin/Release/net10.0-windows10.0.19041.0/permissionscope-cli.exe
      - name: Website regression and accessibility
        if: matrix.architecture == 'x64'
        run: npm run test:site
      - name: Install packaging tool
        shell: pwsh
        run: |
          $last = 1
          foreach ($attempt in 1..3) {
            choco install nsis --version=3.12 -y --no-progress
            $last = $LASTEXITCODE
            if ($last -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (15 * $attempt) }
          }
          exit $last
      - name: Package
        run: ./build/Package.ps1 -Architecture ${{ matrix.architecture }}
      - name: Install and uninstall on disposable runner
        if: matrix.architecture == 'x64'
        run: ./build/Test-Installer.ps1
      - name: Attest package provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip
      - name: Attest package SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip
          sbom-path: artifacts/PermissionScope-${{ env.PERMISSIONSCOPE_VERSION }}-win-${{ matrix.architecture }}/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PermissionScope-windows-${{ matrix.architecture }}
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.json
            artifacts/SHA256SUMS-*.txt
          if-no-files-found: error

  documentation:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Documentation and screenshot integrity
        run: ./build/Verify-Documentation.ps1 -SkipBrowser
