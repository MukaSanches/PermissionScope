name: Multilingual handbooks

on:
  push:
    branches: [main]
    paths:
      - 'build/Generate-Handbooks.mjs'
      - 'docs/content/locales.json'
      - '.github/workflows/handbooks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: handbooks-main
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node build/Generate-Handbooks.mjs
      - name: Verify PDFs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find docs/handbooks -maxdepth 1 -name 'PermissionScope-Handbook-*.pdf' | wc -l)" -eq 8
          test -f docs/handbooks/README.md
      - name: Commit generated handbooks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/handbooks
          if git diff --cached --quiet; then
            echo 'Handbooks already current.'
            exit 0
          fi
          git commit -m 'Generate official multilingual PermissionScope handbooks'
          gh auth setup-git
          git pull --rebase origin main
          git push origin HEAD:main
