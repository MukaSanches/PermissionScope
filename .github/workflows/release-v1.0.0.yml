name: Release PermissionScope 1.0.0

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable v1.0.0 GitHub Release. Run from the v1.0.0 tag only.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-v1.0.0-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: 1.0.0

jobs:
  preflight:
    name: Release preflight
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install website dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Validate resources and website syntax
        run: npm run check
      - name: Build x64
        run: dotnet build PermissionScope.sln -c Release -p:Platform=x64
      - name: Run integration harness
        run: dotnet run --project tests/PermissionScope.Tests -c Release -- --results artifacts/test-results.json
      - name: Website regression and accessibility
        run: npm run test:site
      - name: Documentation and native-capture integrity
        run: ./build/Verify-Documentation.ps1 -SkipBrowser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PermissionScope-v1.0.0-preflight
          path: |
            artifacts/test-results.json
            artifacts/site-tests.json
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package ${{ matrix.architecture }}
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS
        run: choco install nsis --version=3.12 -y --no-progress
      - name: Package
        shell: pwsh
        run: ./build/Package.ps1 -Architecture ${{ matrix.architecture }}
      - name: Install and uninstall on disposable runner
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: ./build/Test-Installer.ps1
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/PermissionScope-1.0.0-${{ matrix.architecture }}-Setup.exe
            artifacts/PermissionScope-1.0.0-win-${{ matrix.architecture }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PermissionScope-v1.0.0-${{ matrix.architecture }}
          path: |
            artifacts/PermissionScope-1.0.0-${{ matrix.architecture }}-Setup.exe
            artifacts/PermissionScope-1.0.0-win-${{ matrix.architecture }}.zip
            artifacts/SHA256SUMS-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 14

  source:
    name: Package source
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure ripgrep is available
        shell: pwsh
        run: if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep -y --no-progress }
      - name: Create source archive
        shell: pwsh
        run: ./build/Package-Source.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PermissionScope-v1.0.0-source
          path: artifacts/PermissionScope-1.0.0-source.zip
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble release evidence
    needs: [package, source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download this run's package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded
          expected=(
            PermissionScope-1.0.0-x64-Setup.exe
            PermissionScope-1.0.0-win-x64.zip
            PermissionScope-1.0.0-arm64-Setup.exe
            PermissionScope-1.0.0-win-arm64.zip
            PermissionScope-1.0.0-source.zip
          )
          for file in "${expected[@]}"; do
            match="$(find downloaded -type f -name "$file" -print -quit)"
            test -n "$match" || { echo "Missing release asset: $file"; exit 1; }
            cp "$match" "dist/$file"
          done
          (cd dist && sha256sum "${expected[@]}" | sed 's/  \*/  /' > SHA256SUMS.txt)
          test "$(wc -l < dist/SHA256SUMS.txt)" -eq 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PermissionScope-v1.0.0-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable GitHub Release
    needs: assemble
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the exact release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/v1.0.0" || {
            echo "Publication is only allowed when this workflow is run from tag v1.0.0. Current ref: $GITHUB_REF"
            exit 1
          }
          git rev-parse v1.0.0^{commit} | grep -qx "$GITHUB_SHA"
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.0 already exists. Refusing to overwrite an existing public release."
            exit 1
          fi
      - name: Download assembled release
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name PermissionScope-v1.0.0-release --dir dist
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.0 dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "PermissionScope 1.0.0" \
            --notes-file docs/releases/v1.0.0.md
