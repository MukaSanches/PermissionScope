name: Release PermissionScope

on:
  pull_request:
    paths:
      - 'Directory.Build.props'
      - 'build/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
      - 'docs/releases/**'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
      - 'build/**'
      - '.github/workflows/release.yml'
      - 'docs/releases/**'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current project version after all gates pass.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Resolve release version from project source of truth
        id: version
        shell: pwsh
        run: |
          . ./build/Get-ProjectVersion.ps1
          $version = Get-ProjectVersion -Root $PWD
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Unexpected project version format: $version"
          }
          if (-not (Test-Path "docs/releases/v$version.md")) {
            throw "Missing release notes: docs/releases/v$version.md"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install website dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Validate resources and website syntax
        run: npm run check
      - name: Build x64
        run: dotnet build PermissionScope.sln -c Release -p:Platform=x64
      - name: Run integration harness
        run: dotnet run --project tests/PermissionScope.Tests -c Release -- --results artifacts/test-results.json
      - name: Website regression and accessibility
        run: npm run test:site
      - name: Documentation and native-capture integrity
        run: ./build/Verify-Documentation.ps1 -SkipBrowser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PermissionScope-v${{ steps.version.outputs.version }}-preflight
          path: |
            artifacts/test-results.json
            artifacts/site-tests.json
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package ${{ matrix.architecture }}
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS with retry
        shell: pwsh
        run: |
          $last = 1
          foreach ($attempt in 1..3) {
            choco install nsis --version=3.12 -y --no-progress
            $last = $LASTEXITCODE
            if ($last -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (15 * $attempt) }
          }
          exit $last
      - name: Package
        shell: pwsh
        run: ./build/Package.ps1 -Architecture ${{ matrix.architecture }}
      - name: Install and uninstall on disposable runner
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: ./build/Test-Installer.ps1
      - name: Attest package provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/PermissionScope-${{ env.RELEASE_VERSION }}-${{ matrix.architecture }}-Setup.exe
            artifacts/PermissionScope-${{ env.RELEASE_VERSION }}-win-${{ matrix.architecture }}.zip
      - name: Attest package SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/PermissionScope-${{ env.RELEASE_VERSION }}-${{ matrix.architecture }}-Setup.exe
            artifacts/PermissionScope-${{ env.RELEASE_VERSION }}-win-${{ matrix.architecture }}.zip
          sbom-path: artifacts/PermissionScope-${{ env.RELEASE_VERSION }}-win-${{ matrix.architecture }}/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PermissionScope-v${{ env.RELEASE_VERSION }}-${{ matrix.architecture }}
          path: |
            artifacts/PermissionScope-${{ env.RELEASE_VERSION }}-${{ matrix.architecture }}-Setup.exe
            artifacts/PermissionScope-${{ env.RELEASE_VERSION }}-win-${{ matrix.architecture }}.zip
            artifacts/SHA256SUMS-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 14

  source:
    name: Package source
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure ripgrep is available
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            $last = 1
            foreach ($attempt in 1..3) {
              choco install ripgrep -y --no-progress
              $last = $LASTEXITCODE
              if ($last -eq 0) { break }
              if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
            }
            if ($last -ne 0) { exit $last }
          }
      - name: Create source archive
        shell: pwsh
        run: ./build/Package-Source.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PermissionScope-v${{ env.RELEASE_VERSION }}-source
          path: artifacts/PermissionScope-${{ env.RELEASE_VERSION }}-source.zip
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble release evidence
    needs: [preflight, package, source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Download this run's package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded
          expected=(
            "PermissionScope-${RELEASE_VERSION}-x64-Setup.exe"
            "PermissionScope-${RELEASE_VERSION}-win-x64.zip"
            "PermissionScope-${RELEASE_VERSION}-arm64-Setup.exe"
            "PermissionScope-${RELEASE_VERSION}-win-arm64.zip"
            "PermissionScope-${RELEASE_VERSION}-source.zip"
          )
          for file in "${expected[@]}"; do
            match="$(find downloaded -type f -name "$file" -print -quit)"
            test -n "$match" || { echo "Missing release asset: $file"; exit 1; }
            cp "$match" "dist/$file"
          done
          (cd dist && sha256sum "${expected[@]}" | sed 's/  \*/  /' > SHA256SUMS.txt)
          test "$(wc -l < dist/SHA256SUMS.txt)" -eq 5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PermissionScope-v${{ env.RELEASE_VERSION }}-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [preflight, assemble]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact current main and successful CI
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Publication is only allowed from main. Current ref: $GITHUB_REF"
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "Checked-out commit does not match the workflow release commit."
            exit 1
          }
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA" || {
            echo "main advanced to $current_main; refusing to publish stale commit $GITHUB_SHA."
            exit 1
          }
          wait_for_workflow() {
            workflow="$1"
            run_id=""
            for _ in $(seq 1 90); do
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              if [ -n "$run_id" ]; then break; fi
              sleep 5
            done
            test -n "$run_id" || { echo "No $workflow run found for $GITHUB_SHA"; exit 1; }
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          }
          wait_for_workflow build.yml
          wait_for_workflow codeql.yml
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA" || {
            echo "main advanced while release gates were running; refusing stale publication."
            exit 1
          }
      - name: Require unused release version
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists. Refusing to overwrite an existing public release."
            exit 1
          fi
          existing=""
          if tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null)"; then
            existing="$(jq -r '.object.sha' <<<"$tag_json")"
          fi
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "$tag already points to $existing, not $GITHUB_SHA. Refusing to move the tag."
            exit 1
          fi
          if [ -z "$existing" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Download assembled release
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "PermissionScope-v${RELEASE_VERSION}-release" --dir dist
      - name: Stage draft release with complete assets
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "PermissionScope ${RELEASE_VERSION}" \
            --notes-file "docs/releases/v${RELEASE_VERSION}.md"
      - name: Publish completed draft
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.immutable // false')"
          echo "Published $tag (immutable=$immutable)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$immutable" != "true" ]; then
            echo "::warning::Release immutability is not enabled for this release. Future releases gain stronger tag/asset protection when repository release immutability is enabled."
          fi