name: Release PermissionScope

on:
  pull_request:
    paths:
      - 'Directory.Build.props'
      - 'build/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
      - 'docs/releases/**'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current 1.0.1 release commit after all gates pass.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-v1.0.1-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: 1.0.1

jobs:
  preflight:
    name: Release preflight
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Require project/release version parity
        shell: pwsh
        run: |
          . ./build/Get-ProjectVersion.ps1
          $version = Get-ProjectVersion -Root $PWD
          if ($version -ne $env:RELEASE_VERSION) { throw "Project version $version does not match release version $env:RELEASE_VERSION." }
      - name: Install website dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Validate resources and website syntax
        run: npm run check
      - name: Build x64
        run: dotnet build PermissionScope.sln -c Release -p:Platform=x64
      - name: Run integration harness
        run: dotnet run --project tests/PermissionScope.Tests -c Release -- --results artifacts/test-results.json
      - name: Website regression and accessibility
        run: npm run test:site
      - name: Documentation and native-capture integrity
        run: ./build/Verify-Documentation.ps1 -SkipBrowser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PermissionScope-v1.0.1-preflight
          path: |
            artifacts/test-results.json
            artifacts/site-tests.json
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package ${{ matrix.architecture }}
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS with retry
        shell: pwsh
        run: |
          $last = 1
          foreach ($attempt in 1..3) {
            choco install nsis --version=3.12 -y --no-progress
            $last = $LASTEXITCODE
            if ($last -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (15 * $attempt) }
          }
          exit $last
      - name: Package
        shell: pwsh
        run: ./build/Package.ps1 -Architecture ${{ matrix.architecture }}
      - name: Install and uninstall on disposable runner
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: ./build/Test-Installer.ps1
      - name: Attest package provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/PermissionScope-1.0.1-${{ matrix.architecture }}-Setup.exe
            artifacts/PermissionScope-1.0.1-win-${{ matrix.architecture }}.zip
      - name: Attest package SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/PermissionScope-1.0.1-${{ matrix.architecture }}-Setup.exe
            artifacts/PermissionScope-1.0.1-win-${{ matrix.architecture }}.zip
          sbom-path: artifacts/PermissionScope-1.0.1-win-${{ matrix.architecture }}/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PermissionScope-v1.0.1-${{ matrix.architecture }}
          path: |
            artifacts/PermissionScope-1.0.1-${{ matrix.architecture }}-Setup.exe
            artifacts/PermissionScope-1.0.1-win-${{ matrix.architecture }}.zip
            artifacts/SHA256SUMS-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 14

  source:
    name: Package source
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure ripgrep is available
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            $last = 1
            foreach ($attempt in 1..3) {
              choco install ripgrep -y --no-progress
              $last = $LASTEXITCODE
              if ($last -eq 0) { break }
              if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
            }
            if ($last -ne 0) { exit $last }
          }
      - name: Create source archive
        shell: pwsh
        run: ./build/Package-Source.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PermissionScope-v1.0.1-source
          path: artifacts/PermissionScope-1.0.1-source.zip
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble release evidence
    needs: [package, source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download this run's package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded
          expected=(
            PermissionScope-1.0.1-x64-Setup.exe
            PermissionScope-1.0.1-win-x64.zip
            PermissionScope-1.0.1-arm64-Setup.exe
            PermissionScope-1.0.1-win-arm64.zip
            PermissionScope-1.0.1-source.zip
          )
          for file in "${expected[@]}"; do
            match="$(find downloaded -type f -name "$file" -print -quit)"
            test -n "$match" || { echo "Missing release asset: $file"; exit 1; }
            cp "$match" "dist/$file"
          done
          (cd dist && sha256sum "${expected[@]}" | sed 's/  \*/  /' > SHA256SUMS.txt)
          test "$(wc -l < dist/SHA256SUMS.txt)" -eq 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PermissionScope-v1.0.1-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable GitHub Release
    needs: assemble
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require exact current main and successful CI
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Automatic publication is only allowed from main. Current ref: $GITHUB_REF"
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "Checked-out commit does not match the workflow release commit."
            exit 1
          }
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA" || {
            echo "main advanced to $current_main; refusing to publish stale commit $GITHUB_SHA."
            exit 1
          }
          wait_for_workflow() {
            workflow="$1"
            run_id=""
            for _ in $(seq 1 90); do
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              if [ -n "$run_id" ]; then break; fi
              sleep 5
            done
            test -n "$run_id" || { echo "No $workflow run found for $GITHUB_SHA"; exit 1; }
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          }
          wait_for_workflow build.yml
          wait_for_workflow codeql.yml
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA" || {
            echo "main advanced while release gates were running; refusing stale publication."
            exit 1
          }
      - name: Require unused version or matching recovery tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.1 already exists. Refusing to overwrite an existing public release."
            exit 1
          fi
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.1" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "v1.0.1 already points to $existing, not $GITHUB_SHA. Refusing to move the tag."
            exit 1
          fi
          if [ -z "$existing" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref='refs/tags/v1.0.1' -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Download assembled release
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name PermissionScope-v1.0.1-release --dir dist
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.1 dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "PermissionScope 1.0.1" \
            --notes-file docs/releases/v1.0.1.md
