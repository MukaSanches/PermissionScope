name: Refresh native documentation screenshots

on:
  push:
    branches:
      - chatgpt/snapshot-import-hardening-2026-09-10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/chatgpt/snapshot-import-hardening-2026-09-10'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/snapshot-import-hardening-2026-09-10
          fetch-depth: 1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Publish documentation binaries
        shell: pwsh
        run: |
          dotnet publish src/PermissionScope.App/PermissionScope.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o artifacts/documentation-app
          dotnet publish src/PermissionScope.Cli/PermissionScope.Cli.csproj -c Release -r win-x64 --self-contained true -o artifacts/documentation-cli
      - name: Create synthetic demo environment
        shell: pwsh
        run: ./build/Create-DemoEnvironment.ps1
      - name: Capture native WinUI documentation
        shell: pwsh
        run: |
          ./build/Capture-Documentation.ps1
          ./build/Capture-Documentation.ps1 -Scenes access -Theme Dark
      - name: Rebuild and verify documentation
        shell: pwsh
        run: |
          node build/Build-Documentation.mjs
          ./build/Verify-Documentation.ps1
      - name: Commit genuine regenerated captures
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots README.md README.*.md docs site
          if (git diff --cached --quiet) {
            Write-Host "No documentation changes to commit."
            exit 0
          }
          git diff --cached --name-only
          git commit -m "docs: regenerate native 1.0.0 screenshots"
          git push origin HEAD:chatgpt/snapshot-import-hardening-2026-09-10
