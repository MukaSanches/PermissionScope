name: Site compatibility

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'build/test-site*.mjs'
      - 'build/validate-resources.mjs'
      - 'build/Enhance-Pages.mjs'
      - 'build/Build-Documentation.mjs'
      - 'docs/content/locales.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site-compatibility.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'build/test-site*.mjs'
      - 'build/validate-resources.mjs'
      - 'build/Enhance-Pages.mjs'
      - 'build/Build-Documentation.mjs'
      - 'docs/content/locales.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Syntax and resource checks
        run: npm run check
      - name: Universal compatibility suite
        run: npm run test:site:compat
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: site-compatibility-report
          path: artifacts/site-compatibility.json
          if-no-files-found: warn
