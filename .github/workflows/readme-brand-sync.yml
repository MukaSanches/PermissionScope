name: README brand sync

on:
  push:
    branches: [main]
    paths:
      - 'build/Polish-Readmes.mjs'
      - 'docs/brand/repository-banner.svg'
      - 'docs/brand/project-avatar.svg'
      - '.github/workflows/readme-brand-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-brand-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Render GitHub-safe PNG brand assets
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet cairosvg==2.8.2
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='docs/brand/repository-banner.svg', write_to='docs/brand/repository-banner.png', output_width=1600, output_height=520)
          cairosvg.svg2png(url='docs/brand/project-avatar.svg', write_to='docs/brand/project-avatar.png', output_width=512, output_height=512)
          PY
      - name: Polish README generator
        run: node build/Polish-Readmes.mjs
      - name: Regenerate every localized README
        run: node build/Build-Documentation.mjs
      - name: Commit synchronized presentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'README presentation already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/Build-Documentation.mjs README*.md .github/README.md docs/brand/repository-banner.png docs/brand/project-avatar.png site
          git commit -m 'Polish multilingual README branding and navigation'
          git pull --rebase origin main
          git push origin HEAD:main
