name: Documentation parity sync

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
      - 'build/Build-Documentation.mjs'
      - 'build/Enhance-Pages.mjs'
      - 'docs/content/locales.json'
      - 'docs/brand/**'
      - 'site/release-sync.js'
      - '.github/workflows/docs-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permissionscope-docs-sync
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    cache-mode: none
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Generate and verify localized source surfaces
        run: |
          node build/Build-Documentation.mjs
          node build/Build-Documentation.mjs --check
      - name: Apply and verify shared progressive Pages layer
        run: |
          node build/Enhance-Pages.mjs
          node build/Enhance-Pages.mjs --check
      - name: Preserve independent repository operations hub
        shell: bash
        run: |
          # .github/README.md is intentionally not a generated localized README.
          # Restore its committed institutional content before diff capture.
          git restore --worktree -- .github/README.md
      - name: Capture generated documentation diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary -- README.md 'README.*.md' docs/guides 'site/index*.html' > generated-docs.patch
          if [[ -s generated-docs.patch ]]; then
            git apply --check --reverse generated-docs.patch
          else
            echo 'Generated documentation already synchronized.'
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PermissionScope-docs-generated
          path: generated-docs.patch
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    cache-mode: none
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download generated documentation diff from this run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated-docs
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name PermissionScope-docs-generated \
            --dir generated-docs
          test -f generated-docs/generated-docs.patch
      - name: Publish generated parity update
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s generated-docs/generated-docs.patch ]]; then
            echo 'Generated documentation already synchronized.'
            exit 0
          fi
          git apply --check generated-docs/generated-docs.patch
          git apply generated-docs/generated-docs.patch
          git config user.name 'permissionscope-docs-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.*.md docs/guides site/index*.html
          git commit -m 'Synchronize multilingual product documentation'
          gh auth setup-git
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type='permissionscope-docs-synced'
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Could not publish synchronized documentation after retries.' >&2
          exit 1
