name: Documentation parity sync

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
      - 'build/Build-Documentation.mjs'
      - 'build/Enhance-Pages.mjs'
      - 'docs/content/locales.json'
      - 'docs/brand/**'
      - 'site/release-sync.js'
      - '.github/workflows/docs-sync.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: permissionscope-docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Generate and verify localized source surfaces
        run: |
          node build/Build-Documentation.mjs
          node build/Build-Documentation.mjs --check
      - name: Apply and verify shared progressive Pages layer
        run: |
          node build/Enhance-Pages.mjs
          node build/Enhance-Pages.mjs --check
      - name: Preserve independent repository operations hub
        shell: bash
        run: |
          # .github/README.md is intentionally not a generated localized README.
          # Restore its committed institutional content before diff/commit logic.
          git restore --worktree -- .github/README.md
      - name: Commit generated parity update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Generated documentation already synchronized.'
            exit 0
          fi
          git config user.name 'permissionscope-docs-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.*.md docs/guides site/index*.html
          git commit -m 'Synchronize multilingual product documentation'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              gh workflow run pages.yml --ref main
              gh workflow run site-compatibility.yml --ref main
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Could not publish synchronized documentation after retries.' >&2
          exit 1
